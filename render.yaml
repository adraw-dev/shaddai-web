# Render Blueprint del CMS (docs/PLAN_STRAPI.md §9 — D-21/D-22).
# Crea el servicio web de Strapi (carpeta cms/) y su base PostgreSQL. El sitio Next NO se despliega
# aquí: va a Vercel como sitio estático.
#
# Uso: Render → New → Blueprint → elegir este repositorio. Los secretos se generan solos.
# Basado en la plantilla oficial render-examples/strapi-postgres (Strapi 4), adaptada a Strapi 5.

services:
  - type: web
    name: shaddai-cms
    runtime: node
    plan: starter # el plan gratuito no admite disco persistente (las imágenes se perderían)
    region: virginia # la región más cercana a Colombia; debe coincidir con la base de datos
    branch: main
    rootDir: cms
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    autoDeploy: true
    buildFilter:
      paths:
        - cms/**
    # Imágenes del Media Library (proveedor local de Strapi) en un disco que sobrevive a los despliegues.
    disk:
      name: strapi-uploads
      mountPath: /opt/render/project/src/cms/public/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: IS_PROXIED
        value: "true"
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: shaddai-cms-db
          property: connectionString
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

databases:
  - name: shaddai-cms-db
    plan: basic-256mb # el plan gratuito de PostgreSQL caduca a los 30 días
    region: virginia
    diskSizeGB: 1
